plugins { id 'com.android.application' }
android {
    namespace 'com.example.batmon'
    compileSdk 33
    defaultConfig {
        applicationId 'com.example.batmon'
        minSdk 28
        targetSdk 28
        versionCode 1
        versionName '1.0'
    }
    buildTypes {
        release { minifyEnabled true; shrinkResources false }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
